<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found | Maheshwar Maharaj</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');
      :root {
        --bg-dark: #07080b;
        --text-main: #f4f4f8;
        --text-muted: #a3a8b8;
        --accent-gold: #e2c044;
        --accent-purple: #7928ca;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Outfit', sans-serif;
        background-color: var(--bg-dark);
        background-image:
          radial-gradient(circle at 10% 40%, rgba(121, 40, 202, 0.12) 0%, transparent 40%),
          radial-gradient(circle at 90% 10%, rgba(226, 192, 68, 0.1) 0%, transparent 40%);

        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .wrap { max-width: 480px; }
      h1 {
        font-size: clamp(3rem, 10vw, 5rem);
        background: linear-gradient(135deg, #e2c044 0%, #f7e39c 50%, #e2c044 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        line-height: 1;
      }
      h2 { margin-top: 12px; font-size: 1.4rem; }
      p { color: var(--text-muted); margin-top: 12px; }
      a.btn {
        display: inline-block;
        margin-top: 28px;
        padding: 14px 28px;
        border-radius: 999px;
        background: linear-gradient(135deg, #e2c044 0%, #f7e39c 50%, #e2c044 100%);
        color: #07080b;
        font-weight: 600;
        text-decoration: none;
      }
